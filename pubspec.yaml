name: resizable_panel_group
description: Accessible, Flutter-native resizable panel groups for split views, sidebars, and editor layouts.
version: 0.1.0
homepage: https://github.com/karloows/resizable_panel_group
repository: https://github.com/karloows/resizable_panel_group
issue_tracker: https://github.com/karloows/resizable_panel_group/issues

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

topics:
  - flutter
  - layout
  - split-view
  - resizable
  - accessibility

screenshots:
  - description: Landscape split workspace with nested resizable panels.
    path: demo/landscape.gif
  - description: Portrait split workspace with stacked resizable panels.
    path: demo/portrait.gif
